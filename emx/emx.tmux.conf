# Config for emx's private tmux server (tmux -L emx -f <this file>). His default server never loads it.

# Claude Code binds Ctrl+B, so tmux gets no prefix at all. emx's own keys are root bindings set by the sidebar.
set -g prefix None
unbind C-b

# Shift+Enter reaches Claude as a newline only with extended keys in csi-u form.
set -s extended-keys always
set -s extended-keys-format csi-u
# Reset first: source-file on upgrade would otherwise append these again each time.
set -su terminal-features
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:RGB'
# A view shows a session through a nested client of this server, whose TERM is tmux-256color: it gets what the xterm* terminal gets, tmux's own xterm* features plus the two above, so keys, colour and cursor pass through as before.
set -as terminal-features 'tmux*:extkeys:RGB:clipboard:ccolour:cstyle:focus:title'
# Each window takes the size of the client that used it last; a session open on two devices at once has one width.
set -g window-size latest

# Copies from a session, including one from a nested emx (a server's emx viewed through `emx remote`), reach the terminal's clipboard; emx never reads ~/.tmux.conf, so tmux's default (external) would drop them.
set -g set-clipboard on
set -g mouse on
set -s escape-time 0
set -g focus-events on
# The panel writes the bar into status-format[0]; blank until then, so tmux's window list never shows the hidden agent windows.
set -g status on
set -g status-position bottom
set -g status-style 'bg=default,fg=default'
set -g status-format[0] ''
# Blank too, so a view with `status 2` never shows tmux's built-in pane list before the bar reaches line 1.
set -g status-format[1] ''
# tmux's default status-line mouse keys would switch to a hidden agent window or open a window menu with Kill; -q keeps a second source-file quiet.
# A click does one thing only: on a phone, on `‹ sessions` over a session (the bar's `back` range), it brings the panel back taking the whole window.
bind -n MouseDown1Status if -F '#{&&:#{==:#{mouse_status_range},back},#{!=:#{@emx_role},sidebar}}' 'select-pane -t :.+ ; resize-pane -Z'
unbind -q -n C-MouseDown1Status
unbind -q -n MouseDown3Status
unbind -q -n M-MouseDown3Status
unbind -q -n MouseDown3StatusLeft
unbind -q -n M-MouseDown3StatusLeft
unbind -q -n WheelUpStatus
unbind -q -n WheelDownStatus

# The panel decides whether a notice is for a session he is looking at from the terminal's last focus report. No -t: each client's report lands on its own view.
set-hook -g client-focus-in 'set-option @emx_focus 1'
set-hook -g client-focus-out 'set-option @emx_focus 0'

# A viewer that exits stays as a dead pane instead of closing, so the layout keeps its two columns and emx can respawn it.
setw -g remain-on-exit on
setw -g remain-on-exit-format ' This viewer has closed. Pick the session on the panel to reopen it.'

setw -g automatic-rename off
setw -g allow-rename off
setw -g pane-border-lines single

# The side with focus is the one with the bright border; the other is dim. Accent 75 matches the panel's accent colour.
# These are Terminal's own, the default scheme; the panel sets these three options (and status-style) for the chosen colour scheme.
setw -g pane-border-style 'fg=colour8'
setw -g pane-active-border-style 'fg=colour4'
