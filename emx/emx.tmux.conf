# Config for emx's private tmux server (tmux -L emx -f <this file>). His default server never loads it.

# Claude Code binds Ctrl+B, so tmux gets no prefix at all. emx's own keys are root bindings set by the sidebar.
set -g prefix None
unbind C-b

# Shift+Enter reaches Claude as a newline only with extended keys in csi-u form.
set -s extended-keys always
set -s extended-keys-format csi-u
# Reset first: source-file on upgrade would otherwise append these again each time.
set -su terminal-features
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:RGB'

set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g status off

# The panel decides whether a notice is for a session he is looking at from the terminal's last focus report.
set-hook -g client-focus-in 'set-option -t "=emx:" @emx_focus 1'
set-hook -g client-focus-out 'set-option -t "=emx:" @emx_focus 0'

# A viewer that exits stays as a dead pane instead of closing, so the layout keeps its two columns and emx can respawn it.
setw -g remain-on-exit on
setw -g remain-on-exit-format ' This viewer has closed. Pick the session on the panel to reopen it.'

setw -g automatic-rename off
setw -g allow-rename off
setw -g pane-border-lines single

# The side with focus is the one with the bright border; the other is dim. Accent 75 matches the panel's accent colour.
setw -g pane-border-style 'fg=colour238'
setw -g pane-active-border-style 'fg=colour75'
